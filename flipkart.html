<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flipkart View</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans"; margin: 16px; color: #0f172a; background: #f8fafc; }
    .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    input[type="text"] { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; width: 360px; }
    button { background: #2563eb; color: white; border: 0; padding: 10px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .pane { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; }
    .pane header { padding: 8px 10px; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; font-weight: 600; font-size: 13px; display:flex; justify-content:space-between; align-items:center; }
    iframe { width: 100%; height: 85vh; border: 0; background: #fff; }
    .note { font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>Flipkart</strong>
    <input id="goal" type="text" placeholder="search term" />
    <button id="apply">Apply</button>
    <a id="fLink" href="#" target="_blank">Open</a>
    <span class="note">If the panel stays blank, click Open.</span>
  </div>
  <div class="pane">
    <header>Flipkart</header>
    <iframe id="fFrame" sandbox="allow-scripts allow-forms allow-same-origin"></iframe>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const goal = el('goal');
    const apply = el('apply');
    const fFrame = el('fFrame');
    const fLink = el('fLink');

    function getParam(name) { const p = new URLSearchParams(location.search); return p.get(name) || ''; }
    function encodeQuery(q) { return encodeURIComponent(q.replace(/\s+/g, ' ').trim()); }

    function setSource(q) {
      const fUrl = `https://www.flipkart.com/search?q=${q}`;
      fFrame.src = fUrl; fLink.href = fUrl;
    }

    const initialQ = getParam('q');
    if (initialQ) { goal.value = decodeURIComponent(initialQ); setSource(initialQ); }

    apply.addEventListener('click', () => {
      const q = encodeQuery(goal.value || '');
      if (!q) { alert('Please enter a query'); return; }
      history.replaceState(null, '', `?q=${q}`);
      setSource(q);
    });
  </script>
</body>
</html>
